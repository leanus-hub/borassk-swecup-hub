skjutvall:()=>"<h2>Skjutvall</h2><section class=\"panel\"><p><strong>Ansvarig:</strong> Rolland</p><span class=\"tag\">Tidsschema från 2026 – referens, ej fastställt för 2027</span><div style=\"overflow-x:auto\"><table><thead><tr><th>Dag</th><th>Moment</th><th>Tid</th></tr></thead><tbody><tr><td style=\"padding:8px;border-bottom:1px solid #ddd\">Fredag</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">Vapenkontroll</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">14:00–17:30</td></tr><tr><td style=\"padding:8px;border-bottom:1px solid #ddd\">Fredag</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">Träning pass 1</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">14:30–15:45</td></tr><tr><td style=\"padding:8px;border-bottom:1px solid #ddd\">Fredag</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">Pappbyte/målning</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">15:45–16:00</td></tr><tr><td style=\"padding:8px;border-bottom:1px solid #ddd\">Fredag</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">Träning pass 2</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">16:00–17:15</td></tr><tr><td style=\"padding:8px;border-bottom:1px solid #ddd\">Lördag</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">Papptavlor</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">08:00–09:00</td></tr><tr><td style=\"padding:8px;border-bottom:1px solid #ddd\">Lördag</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">Inskjutning 1</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">09:00–09:50</td></tr><tr><td style=\"padding:8px;border-bottom:1px solid #ddd\">Lördag</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">Första start 1</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">10:00</td></tr><tr><td style=\"padding:8px;border-bottom:1px solid #ddd\">Lördag</td><td style=\"padding:8px;border-bottom:1px solid #ddd\">Målning</td><td style=\"padding:8px;border-bottom:1px so et=\"_blank\" rel=\"noopener noreferrer\">Öppna KES-instruktionen (PDF) ↗</a></p></section>",
spar:()=>"<h2>Spår & bandragning</h2><section class=\"panel\"><span class=\"tag\">Banskisser från 2026 – referens</span><p>Banorna i det uppladdade underlaget är <strong>1,5 km, 2 km, 2,5 km, 3 km och 3,3 km</strong>.</p><p>Spår före tävling: Håkan och Christoffer. Under tävlingshelgen: Ulf.</p><p class=\"muted\"><a href=\"documents/SWE%20CUP%20Bor%C3%A5s%20Banskisser.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Öppna samtliga banskisser (PDF) ↗</a>. Banor för 2027 är inte fastställda.</p></section>",
nytt:()=>"<h2>Kontakta arrangören</h2><section class=\"panel\"><p>Välj kategori så visas rätt formulär. När du skickar öppnas ett färdigt mejl till arrangören. Ingen information lagras på webbplatsen.</p><form id=\"proposal\"><label for=\"kind\">Vad vill du göra?</label><select id=\"kind\"><option value=\"meeting\">Skicka en mötesfråga</option><option value=\"volunteer\">Anmäla mig som funktionär</option><option value=\"activity\">Föreslå en aktivitet</option><option value=\"other\">Annan fråga</option></select><div id=\"proposalFields\"></div><p class=\"muted\">Granska och skicka mejlet i ditt e-postprogram.</p><button type=\"submit\" class=\"primary\">✉ Skapa e-post</button></form></section>",
instruktioner:()=>"<h2>Instruktioner & dokument</h2><section class=\"panel\"><p>Här samlar vi tävlings-PM, arenakarta, banskisser och instruktioner per funktion.</p><p class=\"muted\">Dokument publiceras successivt efter granskning.</p><h3>Bilder över tävlingsområdet</h3><p class=\"muted\">Tryck på en bild för att öppna den i full storlek.</p><h3>Arenaöversikt</h3><p class=\"muted\">Översikt från tidigare tävling (2026), ej fastställd för 2027.</p><a href=\"documents/Arena%20%C3%B6versikt.png\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"documents/Arena%20%C3%B6versikt.png\" alt=\"Arenaöversikt SweCup Borås 2026\" style=\"width:100%;max-width:680px;height:auto;border-radius:10px\" loading=\"lazy\"></a><p><a href=\"documents/Arena%20%C3%B6versikt.png\" target=\"_blank\" rel=\"noopener noreferrer\">Öppna arenakarta i full storlek ↗</a></p><h3>Referensdokument</h3><p><a href=\"documents/TD-rapport%20Swecup%207o8.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">TD-rapport från tidigare tävling ↗</a></p><p><a href=\"documents/SWE%20CUP%20Bor%C3%A5s%20Banskisser.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Banskisser 2026 (PDF) ↗</a></p><p><a href=\"documents/Key%20board%20KES%20beskrivning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">KES – tangentbordsinstruktion (PDF) ↗</a></p><h3>Bildgalleri – SweCup 2026</h3><div class=\"grid\"><figure style=\"margin:0\"><a href=\"images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-69.jpg\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-69.jpg\" alt=\"Upploppet – februari 2026\" style=\"width:100%;height:230px;object-fit:cover;border-radius:10px\" loading=\"lazy\"></a><figcaption class=\"muted\">Upploppet – februari 2026</figcaption></figure><figure style=\"margin:0\"><a href=\"images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-45.jpg\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-45.jpg\" alt=\"Tävlingsområdet – februari 2026\" style=\"width:100%;height:230px;object-fit:cover;border-radius:10px\" loading=\"lazy\"></a><figcaption class=\"muted\">Tävlingsområdet – februari 2026</figcaption></figure><figure style=\"margin:0\"><a href=\"images/CS_SvensktSkidskytte_Bora%CC%8As_21feb_2026-48.jpg\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"images/CS_SvensktSkidskytte_Bora%CC%8As_21feb_2026-48.jpg\" alt=\"Borås SK – februari 2026\" style=\"width:100%;height:230px;object-fit:cover;border-radius:10px\" loading=\"lazy\"></a><figcaption class=\"muted\">Borås SK – februari 2026</figcaption></figure></div><h3>Fler bilder över området</h3><div class=\"grid\"><figure style=\"margin:0\"><a href=\"images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-02.jpg\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-02.jpg\" alt=\"Områdesbild från SweCup Borås 22 februari 2026, bild 02\" style=\"width:100%;height:230px;object-fit:cover;border-radius:10px\" loading=\"lazy\"></a><figcaption class=\"muted\">Områdesbild 02 · 22 februari 2026</figcaption></figure><figure style=\"margin:0\"><a href=\"images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-03.jpg\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-03.jpg\" alt=\"Områdesbild från SweCup Borås 22 februari 2026, bild 03\" style=\"width:100%;height:230px;object-fit:cover;border-radius:10px\" loading=\"lazy\"></a><figcaption class=\"muted\">Områdesbild 03 · 22 februari 2026</figcaption></figure><figure style=\"margin:0\"><a href=\"images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-06.jpg\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-06.jpg\" alt=\"Områdesbild från SweCup Borås 22 februari 2026, bild 06\" style=\"width:100%;height:230px;object-fit:cover;border-radius:10px\" loading=\"lazy\"></a><figcaption class=\"muted\">Områdesbil const proposalFields={
meeting:'<label for="person">Ditt namn *</label><input id="person" required placeholder="För- och efternamn"><label for="details">Vad gäller frågan? *</label><textarea id="details" required placeholder="Fråga till mötet"></textarea>',
volunteer:'<label for="person">Ditt namn *</label><input id="person" required placeholder="För- och efternamn"><label for="area">Vilket område? *</label><select id="area" required><option value="">Välj område</option><option>Café / servering</option><option>Skjutvall</option><option>Start / mål</option><option>Spår</option><option>Sekretariat</option><option>Parkering / säkerhet</option><option>Arena / uppbyggnad</option><option>Annat / där det behövs</option></select><label for="days">Vilka dagar?</label><select id="days"><option>Ej bestämt</option><option>Fredag 15 januari</option><option>Lördag 16 januari</option><option>Söndag 17 januari</option><option>Flera dagar – se kommentar</option></select><label for="details">Kommentar / tillgängliga tider</label><textarea id="details" placeholder="Frivilligt"></textarea>',
activity:'<label for="person">Ditt namn *</label><input id="person" required placeholder="För- och efternamn"><label for="heading">Aktivitet *</label><input id="heading" required maxlength="140"><label for="area">Område</label><select id="area"><option>Gemensamt</option><option>Logistik / café</option><option>Skjutvall</option><option>Start / mål</option><option>Spår</option><option>Sekretariat</option><option>Arena</option><option>Annat</option></select><label for="deadline">Deadline</label><input id="deadline" type="date"><label for="details">Beskrivning</label><textarea id="details"></textarea>',
other:'<label for="person">Ditt namn *</label><input id="person" required placeholder="För- och efternamn"><label for="heading">Ämne *</label><input id="heading" required maxlength="140"><label for="details">Meddelande *</label><textarea id="details" required></textarea>'
};
function renderProposalFields(){document.getElementById("proposalFields").innerHTML=proposalFields[document.getElementById("kind").value]}
function sendProposal(e){e.preventDefault();const v=id=>document.getElementById(id)?.value.trim()||"";const kind=v("kind");const titles={meeting:"Mötesfråga",volunteer:"Funktionärsanmälan",activity:"Aktivitetsförslag",other:"Fråga"};const lines=["SweCup 5–6, Borås 2027","Typ: "+titles[kind],"Från: "+v("person")];if(v("heading"))lines.push("Rubrik: "+v("heading"));if(v("area"))lines.push("Område: "+v("area"));if(v("days"))lines.push("Tillgänglighet: "+v("days"));if(v("deadline"))lines.push("Deadline: "+v("deadline"));if(v("details"))lines.push("","Meddelande:",v("details"));const subject="SweCup Hub – "+titles[kind]+(v("heading")?": "+v("heading"):"");location.href="mailto:linus.hall@gmail.com?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(lines.join("\n"))}
function go(page){const fullPage=page;const basePage=page.split("/")[0];if(!pages[basePage])page="hem";const activePage=page.split("/")[0];if(location.hash.slice(1)!==page)location.hash=page;document.getElementById("nav").innerHTML=Object.entries(labels).map(([k,v])=>'<button class="'+(activePage===k?'active':'')+'" onclick="go(\''+k+'\')">'+v+'</button>').join('');document.getElementById("view").innerHTML=pages[activePage]();if(activePage==="nytt"){document.getElementById("proposal").addEventListener("submit",sendProposal);document.getElementById("kind").addEventListener("change",renderProposalFields);renderProposalFields();}window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));go(location.hash.slice(1));
</script></body></html>
