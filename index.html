spar:()=>"<h2>Spår & bandragning</h2><section class=\"panel\"><span class=\"tag\">Banskisser från 2026 – referens</span><p>Banorna i det uppladdade underlaget är <strong>1,5 km, 2 km, 2,5 km, 3 km och 3,3 km</strong>.</p><p>Spår före tävling: Håkan och Christoffer. Under tävlingshelgen: Ulf.</p><p class=\"muted\">Original-PDF med samtliga kartor behöver laddas upp i GitHub för att kunna visas här. Banor för 2027 är inte fastställda.</p></section>",

const proposalFields={
meeting:'<label for="person">Ditt namn *</label><input id="person" required placeholder="För- och efternamn"><label for="details">Vad gäller frågan? *</label><textarea id="details" required placeholder="Fråga till mötet"></textarea>',
volunteer:'<label for="person">Ditt namn *</label><input id="person" required placeholder="För- och efternamn"><label for="area">Vilket område? *</label><select id="area" required><option value="">Välj område</option><option>Café / servering</option><option>Skjutvall</option><option>Start / mål</option><option>Spår</option><option>Sekretariat</option><option>Parkering / säkerhet</option><option>Arena / uppbyggnad</option><option>Annat / där det behövs</option></select><label for="days">Vilka dagar?</label><select id="days"><option>Ej bestämt</option><option>Fredag 15 januari</option><option>Lördag 16 januari</option><option>Söndag 17 januari</option><option>Flera dagar – se kommentar</option></select><label for="details">Kommentar / tillgängliga tider</label><textarea id="details" placeholder="Frivilligt"></textarea>',
activity:'<label for="person">Ditt namn *</label><input id="person" required placeholder="För- och efternamn"><label for="heading">Aktivitet *</label><input id="heading" required maxlength="140"><label for="area">Område</label><select id="area"><option>Gemensamt</option><option>Logistik / café</option><option>Skjutvall</option><option>Start / mål</option><option>Spår</option><option>Sekretariat</option><option>Arena</option><option>Annat</option></select><label for="deadline">Deadline</label><input id="deadline" type="date"><label for="details">Beskrivning</label><textarea id="details"></textarea>',
other:'<label for="person">Ditt namn *</label><input id="person" required placeholder="För- och efternamn"><label for="heading">Ämne *</label><input id="heading" required maxlength="140"><label for="details">Meddelande *</label><textarea id="details" required></textarea>'
};
function renderProposalFields(){document.getElementById("proposalFields").innerHTML=proposalFields[document.getElementById("kind").value]}
function sendProposal(e){e.preventDefault();const v=id=>document.getElementById(id)?.value.trim()||"";const kind=v("kind");const titles={meeting:"Mötesfråga",volunteer:"Funktionärsanmälan",activity:"Aktivitetsförslag",other:"Fråga"};const lines=["SweCup 5–6, Borås 2027","Typ: "+titles[kind],"Från: "+v("person")];if(v("heading"))lines.push("Rubrik: "+v("heading"));if(v("area"))lines.push("Område: "+v("area"));if(v("days"))lines.push("Tillgänglighet: "+v("days"));if(v("deadline"))lines.push("Deadline: "+v("deadline"));if(v("details"))lines.push("","Meddelande:",v("details"));const subject="SweCup Hub – "+titles[kind]+(v("heading")?": "+v("heading"):"");location.href="mailto:linus.hall@gmail.com?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(lines.join("\n"))}
function go(page){if(!pages[page])page="hem";location.hash=page;document.getElementById("nav").innerHTML=Object.entries(labels).map(([k,v])=>'<button class="'+(page===k?'active':'')+'" onclick="go(\''+k+'\')">'+v+'</button>').join('');document.getElementById("view").innerHTML=pages[page]();if(page==="nytt"){document.getElementById("proposal").addEventListener("submit",sendProposal);document.getElementById("kind").addEventListener("change",renderProposalFields);renderProposalFields();}window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));go(location.hash.slice(1));
</script></body></html>
