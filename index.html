<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132b39"><title>SweCup Hub | Borås SK</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18313e;background:#f4f7f8}*{box-sizing:border-box}body{margin:0}header{background:#132b39;color:white;padding:24px max(20px,calc((100vw - 1100px)/2))}header small{color:#b7d3df}header h1{margin:5px 0;font-size:2rem}.wrap{max-width:1100px;margin:auto;padding:24px 18px 70px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}button{font:inherit;cursor:pointer;border:1px solid #d3dfe3;border-radius:10px;background:white;padding:10px 15px;color:#18313e}button.active{background:#146477;color:white;border-color:#146477}.panel{background:white;border:1px solid #e0e8eb;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 3px 12px #16344208}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.muted{color:#5d737e}.tag{display:inline-block;background:#e7f3f5;color:#115a68;border-radius:20px;padding:4px 10px;font-size:.8rem}h2{margin:0 0 14px}h3{margin:0 0 8px}p{line-height:1.55}li{margin:6px 0}ul{padding-left:20px}.item{border-bottom:1px solid #edf1f3;padding:13px 0}.item:last-child{border:0}a{color:#086479}footer{margin-top:30px;color:#6c7f88;font-size:.85rem}.notice{border-left:4px solid #146477;padding:12px 16px;background:#edf6f7;border-radius:6px}.pill{font-size:.8rem;background:#f0f3f4;border-radius:20px;padding:3px 8px}.hide{display:none}@media(max-width:500px){header h1{font-size:1.65rem}.panel{padding:17px}}
input,select,textarea{font:inherit;width:100%;border:1px solid #cbd9df;border-radius:9px;padding:11px;background:white;color:#18313e}textarea{min-height:110px}label{display:block;font-weight:600;margin:12px 0 5px}.primary{background:#146477;color:white;border-color:#146477}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 14px}</style></head><body>
<header><small>BORÅS SK · TÄVLINGSORGANISATION</small><h1>⛷️ SweCup Hub</h1><div>SweCup 5–6 · 15–17 januari 2027</div></header>
<main class="wrap"><nav id="nav" aria-label="Huvudmeny"></nav><div id="view"></div><footer>Information för tävlingsorganisationen · Publicerat innehåll är öppet och ska inte innehålla känsliga personuppgifter.</footer></main>
<script>
const groups=[
{name:"Evenemang & samordning",owner:"Linus",scope:["Övergripande planering och budget","Samordning av ansvariga, möten och beslut","Kontakt med förbund, kommun och partners"]},
{name:"Tävlingsledning",owner:"Att tillsätta",scope:["Tävlingsgenomförande och regelverk","Samverkan med TD och jury","Tävlingsbeslut och lagledarmöten"]},
{name:"Teknisk delegat (TD)",owner:"Christin Rudh",scope:["Teknisk delegat utsedd av förbundet","Samverkan med tävlingsledning och jury"]},
{name:"Logistik",owner:"Per-Anders (P-A)",scope:["Café, mat och funktionärsservice","Boende, vallabodar och antidopinglokal","Material, leveranser och praktisk logistik"]},
{name:"Säkerhet",owner:"Marcus",scope:["Säkerhetsplan och sjukvårdsberedskap","Parkering, trafik, avspärrningar och ackreditering","Halkbekämpning och incidentrutiner"]},
{name:"Arena",owner:"Christoffer",scope:["Arenabyggnation och rivning","Publikytor, skyltning och renhållning","El, IT, speakerplats och fysisk start-/måluppbyggnad"]},
{name:"Skjutbana",owner:"Rolland",scope:["Skjutvall och utrustning","Inskjutning, funktionärer och bomprotokoll","Säkerhetsrutiner, vapenhantering och straffrunda"]},
{name:"Spår – förberedelser",owner:"Håkan & Christoffer",scope:["Spårdragning, snö och preparering före helgen","Banmarkeringar och reservplan","Överlämning till Ulf inför tävlingarna"]},
{name:"Spår – tävlingshelg",owner:"Ulf",scope:["Spårpreparering och kontroll under tävlingshelgen","Ban- och spårfunktionärer","Banöppning, avspärrningar och säkerhet längs spåret"]},
{name:"Tävlingssekretariat",owner:"Kristin",scope:["Anmälningar, PM och deltagarinformation","Nummerlappar, startlistor och sekretariat","Priser, ceremonier och resultatadministration"]},
{name:"Start & mål",owner:"Att bekräfta",scope:["Start- och målfunktionärer","Kontroller och flöden i start-/målområdet","Samordning med tidtagning och sekretariat"]},
{name:"Tidtagning & resultat",owner:"Joakim Dolk (förbundet)",scope:["Tidtagning, utrustning och tester","Start- och resultatlistor","Reservrutiner och resultatpublicering"]},
{name:"Kommunikation",owner:"Linus / att fördela",scope:["Information till funktionärer och publik","Webb, nyheter och sponsorer","Skyltning och extern kommunikation"]}];
const meetings=[{date:"Tisdag 3 november 2026 · tid ej angiven",title:"Uppstartsmöte – SweCup 5–6",status:"Förslag till agenda",agenda:["Syfte, mål och lärdomar från tidigare arrangemang","Bekräfta organisation och ansvarsområden","Tävlingsupplägg och preliminärt tidsschema","Bemanningsbehov och kritiska förberedelser","Arbetssätt, mötesfrekvens och dokumentation","Beslut, ansvariga och nästa steg"],decisions:[]}];
const tasks=[["Tillsätta tävlingsledare","Tävlingsorganisation","Ej påbörjad"],["Bekräfta ansvarig för start och mål","Tävlingsorganisation","Ej påbörjad"],["Utse operativ caféansvarig","P-A","Ej påbörjad"],["Fastställa preliminärt tävlingsprogram","Tävlingsledning","Ej påbörjad"],["Ta fram bemanningsplan per område","Alla områdesansvariga","Ej påbörjad"]];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const list=a=>'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
const pages={
hem:()=>'<section class="panel"><figure style="margin:0 0 20px"><img src="images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-69.jpg" alt="Skidskytt på upploppet under tävling i Borås februari 2026" style="width:100%;max-height:410px;object-fit:cover;object-position:center 60%;border-radius:14px" loading="eager"><figcaption class="muted" style="font-size:.85rem">Bild från tävlingen i Borås, februari 2026 · Svenskt Skidskytte</figcaption></figure><span class="tag">Planering pågår</span><h2 style="margin-top:12px">Välkommen till SweCup Hub</h2><p>Gemensam informationsplats för tävlingsledning, arbetsgrupper och funktionärer inför SweCup 5–6 i Borås den 15–17 januari 2027.</p><div class="notice"><strong>Nästa steg:</strong> Uppstartsmöte för att bekräfta ansvariga, bemanning och tävlingsupplägg. Mötet hålls tisdag 3 november 2026.</div></section><div class="grid"><section class="panel"><h3>Organisation</h3><p class="muted">'+groups.length+' ansvarsområden med uppdrag och kontaktvägar.</p><button onclick="go(\'organisation\')">Visa arbetsgrupper</button></section><section class="panel"><h3>Möten & protokoll</h3><p class="muted">Agendor, beslut och mötesanteckningar samlade.</p><button onclick="go(\'moten\')">Visa möten</button></section><section class="panel"><h3>Att göra</h3><p class="muted">Gemensamma uppgifter och ansvarsfördelning.</p><button onclick="go(\'aktiviteter\')">Visa aktiviteter</button></section></div>',
organisation:()=>'<h2>Organisation & arbetsgrupper</h2><p class="muted">Preliminär ansvarsfördelning. Roller som inte är fastställda markeras nedan.</p><div class="grid">'+groups.map(g=>'<article class="panel"><h3>'+esc(g.name)+'</h3><p><span class="tag">'+esc(g.owner)+'</span></p>'+list(g.scope)+'</article>').join('')+'</div>',
moten:()=>'<h2>Möten & protokoll</h2>'+meetings.map(m=>'<article class="panel"><span class="tag">'+esc(m.status)+'</span><h3 style="margin-top:12px">'+esc(m.title)+'</h3><p class="muted">'+esc(m.date)+'</p><h3>Agenda</h3><ol>'+m.agenda.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><h3>Beslut / protokoll</h3><p class="muted">Publiceras efter mötet.</p></article>').join(''),
aktiviteter:()=>'<h2>Aktiviteter & beslut</h2><section class="panel"><p class="muted">Första förslag till uppgifter. Status uppdateras när ansvariga rapporterar in.</p>'+tasks.map(t=>'<div class="item"><strong>'+esc(t[0])+'</strong><p class="muted" style="margin:5px 0">Ansvar: '+esc(t[1])+' · <span class="pill">'+esc(t[2])+'</span></p></div>').join('')+'</section>',
bemanning:()=>'<h2>Bemanning & schema</h2><section class="panel"><p>Här publicerar vi funktionärer, arbetsgrupper och pass när bemanningen är bekräftad.</p><p class="muted">Inga personliga kontaktuppgifter publiceras på den öppna webbplatsen.</p></section>',
nytt:()=>"<h2>Kontakta arrangören</h2><section class=\"panel\"><p>Välj kategori så visas rätt formulär. När du skickar öppnas ett färdigt mejl till arrangören. Ingen information lagras på webbplatsen.</p><form id=\"proposal\"><label for=\"kind\">Vad vill du göra?</label><select id=\"kind\"><option value=\"meeting\">Skicka en mötesfråga</option><option value=\"volunteer\">Anmäla mig som funktionär</option><option value=\"activity\">Föreslå en aktivitet</option><option value=\"other\">Annan fråga</option></select><div id=\"proposalFields\"></div><p class=\"muted\">Granska och skicka mejlet i ditt e-postprogram.</p><button type=\"submit\" class=\"primary\">✉ Skapa e-post</button></form></section>",
instruktioner:()=>'<h2>Instruktioner & dokument</h2><section class="panel"><p>Här samlar vi tävlings-PM, arenakarta, banskisser och instruktioner per funktion.</p><p class="muted">Dokument publiceras successivt efter granskning.</p><h3>Bildgalleri – SweCup 2026</h3><div class="grid"><figure style="margin:0"><img src="images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-69.jpg" alt="Upploppet – februari 2026" style="width:100%;height:230px;object-fit:cover;border-radius:10px" loading="lazy"><figcaption class="muted">Upploppet – februari 2026</figcaption></figure><figure style="margin:0"><img src="images/CS_SvensktSkidskytte_Bora%CC%8As_22feb_2026-45.jpg" alt="Tävlingsområdet – februari 2026" style="width:100%;height:230px;object-fit:cover;border-radius:10px" loading="lazy"><figcaption class="muted">Tävlingsområdet – februari 2026</figcaption></figure><figure style="margin:0"><img src="images/CS_SvensktSkidskytte_Bora%CC%8As_21feb_2026-48.jpg" alt="Borås SK – februari 2026" style="width:100%;height:230px;object-fit:cover;border-radius:10px" loading="lazy"><figcaption class="muted">Borås SK – februari 2026</figcaption></figure></div><div class="item"><strong>Bild från Svenskt Skidskytte – Borås 22 februari 2026</strong><p class="muted">CS_SvensktSkidskytte_Borås_22feb_2026-06.jpg</p><p><a href="https://svensktskidskytte.mediaflowportal.com/folder/1015712/" target="_blank" rel="noopener noreferrer">Öppna bildmappen hos Svenskt Skidskytte ↗</a></p><p class="muted">Länk till källmappen. Bilden är ännu inte uppladdad direkt till SweCup Hub.</p></div></section>'
};
const labels={hem:"Översikt",organisation:"Organisation",moten:"Möten",aktiviteter:"Aktiviteter",bemanning:"Bemanning",instruktioner:"Dokument",nytt:"Formulär"};
const proposalFields={
meeting:'<label for="person">Ditt namn *</label><input id="person" required placeholder="För- och efternamn"><label for="details">Vad gäller frågan? *</label><textarea id="details" required placeholder="Fråga till mötet"></textarea>',
volunteer:'<label for="person">Ditt namn *</label><input id="person" required placeholder="För- och efternamn"><label for="area">Vilket område? *</label><select id="area" required><option value="">Välj område</option><option>Café / servering</option><option>Skjutvall</option><option>Start / mål</option><option>Spår</option><option>Sekretariat</option><option>Parkering / säkerhet</option><option>Arena / uppbyggnad</option><option>Annat / där det behövs</option></select><label for="days">Vilka dagar?</label><select id="days"><option>Ej bestämt</option><option>Fredag 15 januari</option><option>Lördag 16 januari</option><option>Söndag 17 januari</option><option>Flera dagar – se kommentar</option></select><label for="details">Kommentar / tillgängliga tider</label><textarea id="details" placeholder="Frivilligt"></textarea>',
activity:'<label for="person">Ditt namn *</label><input id="person" required placeholder="För- och efternamn"><label for="heading">Aktivitet *</label><input id="heading" required maxlength="140"><label for="area">Område</label><select id="area"><option>Gemensamt</option><option>Logistik / café</option><option>Skjutvall</option><option>Start / mål</option><option>Spår</option><option>Sekretariat</option><option>Arena</option><option>Annat</option></select><label for="deadline">Deadline</label><input id="deadline" type="date"><label for="details">Beskrivning</label><textarea id="details"></textarea>',
other:'<label for="person">Ditt namn *</label><input id="person" required placeholder="För- och efternamn"><label for="heading">Ämne *</label><input id="heading" required maxlength="140"><label for="details">Meddelande *</label><textarea id="details" required></textarea>'
};
function renderProposalFields(){document.getElementById("proposalFields").innerHTML=proposalFields[document.getElementById("kind").value]}
function sendProposal(e){e.preventDefault();const v=id=>document.getElementById(id)?.value.trim()||"";const kind=v("kind");const titles={meeting:"Mötesfråga",volunteer:"Funktionärsanmälan",activity:"Aktivitetsförslag",other:"Fråga"};const lines=["SweCup 5–6, Borås 2027","Typ: "+titles[kind],"Från: "+v("person")];if(v("heading"))lines.push("Rubrik: "+v("heading"));if(v("area"))lines.push("Område: "+v("area"));if(v("days"))lines.push("Tillgänglighet: "+v("days"));if(v("deadline"))lines.push("Deadline: "+v("deadline"));if(v("details"))lines.push("","Meddelande:",v("details"));const subject="SweCup Hub – "+titles[kind]+(v("heading")?": "+v("heading"):"");location.href="mailto:linus.hall@gmail.com?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(lines.join("\n"))}
function go(page){if(!pages[page])page="hem";location.hash=page;document.getElementById("nav").innerHTML=Object.entries(labels).map(([k,v])=>'<button class="'+(page===k?'active':'')+'" onclick="go(\''+k+'\')">'+v+'</button>').join('');document.getElementById("view").innerHTML=pages[page]();if(page==="nytt"){document.getElementById("proposal").addEventListener("submit",sendProposal);document.getElementById("kind").addEventListener("change",renderProposalFields);renderProposalFields();}window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));go(location.hash.slice(1));
</script></body></html>
